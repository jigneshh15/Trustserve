services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      EXPORT_DIR: /app/data
    volumes:
      - trustserve-data:/app/data
  frontend:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
volumes:
  trustserve-data:
